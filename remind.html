<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Add Reminder</title>
<style>
:root{--bg:#FCFCFB;--ink:#2E2C27;--soft:#6B6A63;--hair:#E4E3DC;--clay:#C6613F;--on:#FCFCFB}
@media (prefers-color-scheme:dark){:root{--bg:#181715;--ink:#ECEAE3;--soft:#A8A69C;--hair:#34322D;--clay:#D0714F}}
body{margin:0;background:var(--bg);color:var(--soft);font:15px/1.5 -apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;color:var(--ink);font:600 24px/1.25 Georgia,serif}
.item{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.t{color:var(--ink);font-weight:600;margin:0}
.n{margin:4px 0 0;word-break:break-word}
.btn{align-self:flex-start;background:var(--clay);color:var(--on);border-radius:8px;padding:12px 20px;font:500 15px -apple-system,sans-serif;text-decoration:none}
p{margin:0}
</style>
</head>
<body>
<main>
<h1 id="h">Add to Top Priorities</h1>
<div class="item" id="item"><p class="t" id="t"></p><p class="n" id="n"></p></div>
<a class="btn" id="go" href="#">Add Reminder</a>
<p id="hint">If Shortcuts didn't open by itself, tap the button.</p>
</main>
<script>
(function(){
  // Reminder text travels after the # so it never reaches the server.
  var raw = location.hash.slice(1), text = "";
  try { text = decodeURIComponent(raw.replace(/\+/g, "%20")); } catch (e) { text = ""; }
  var lines = text.split("\n");
  var title = (lines[0] || "").trim(), notes = lines.slice(1).join(" ").trim();
  if (!title) {
    document.getElementById("h").textContent = "Nothing to add";
    document.getElementById("item").hidden = true;
    document.getElementById("go").hidden = true;
    document.getElementById("hint").textContent = "This link didn't include a reminder.";
    return;
  }
  document.getElementById("t").textContent = title;
  document.getElementById("n").textContent = notes;
  var url = "shortcuts://run-shortcut?name=" + encodeURIComponent("Top Priorities Reminder") +
            "&input=text&text=" + encodeURIComponent(title + "\n" + notes);
  document.getElementById("go").href = url;
  setTimeout(function(){ location.href = url; }, 150);
})();
</script>
</body>
</html>
